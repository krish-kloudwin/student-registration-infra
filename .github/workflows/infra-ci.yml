name: Infrastructure CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  infrastructure-ci:
    name: Infrastructure CI
    runs-on: ubuntu-24.04

    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      CI_ACME_DIR: ${{ runner.temp }}/acme-challenge
      CI_LETSENCRYPT_DIR: ${{ runner.temp }}/letsencrypt

    steps:
      - name: Check out infrastructure repository
        uses: actions/checkout@v6
        with:
          path: student-registration-infra

      - name: Check out backend repository
        uses: actions/checkout@v6
        with:
          repository: krish-src/student-registration-backend
          path: student-registration-backend

      - name: Check out frontend repository
        uses: actions/checkout@v6
        with:
          repository: krish-src/student-registration-frontend
          path: student-registration-frontend

      - name: Create CI environment file
        working-directory: student-registration-infra
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=student_app
          POSTGRES_PASSWORD=ci_test_password
          POSTGRES_DB=student_registration
          CORS_ORIGINS=http://localhost
          JWT_SECRET_KEY=ci-test-jwt-secret-key
          JWT_ALGORITHM=HS256
          JWT_EXPIRE_MINUTES=60
          EOF

      - name: Create temporary Nginx Basic Auth credentials
        working-directory: student-registration-infra
        run: |
          printf 'evaluator:%s\n' "$(openssl passwd -apr1 'ci-test-password')" > nginx/.htpasswd

      - name: Create temporary CI TLS certificate
        run: |
          set -euo pipefail

          mkdir -p \
            "$CI_ACME_DIR" \
            "$CI_LETSENCRYPT_DIR/live/32.195.71.91"

          openssl req \
            -x509 \
            -nodes \
            -newkey rsa:2048 \
            -days 1 \
            -keyout "$CI_LETSENCRYPT_DIR/live/32.195.71.91/privkey.pem" \
            -out "$CI_LETSENCRYPT_DIR/live/32.195.71.91/fullchain.pem" \
            -subj "/CN=32.195.71.91" \
            -addext "subjectAltName=IP:32.195.71.91"

      - name: Validate Docker Compose configuration
        working-directory: student-registration-infra
        run: |
          docker compose config -q

      - name: Build complete Docker stack
        working-directory: student-registration-infra
        run: |
          docker compose build

      - name: Start complete Docker stack
        working-directory: student-registration-infra
        run: |
          docker compose up -d

      - name: Show running services
        working-directory: student-registration-infra
        run: |
          docker compose ps

      - name: Validate Nginx configuration
        working-directory: student-registration-infra
        run: |
          docker compose exec -T nginx nginx -t

      - name: Stop and clean up Docker stack
        if: always()
        working-directory: student-registration-infra
        run: |
          docker compose down -v --remove-orphans

      - name: Remove temporary CI credentials
        if: always()
        working-directory: student-registration-infra
        run: |
          rm -f .env
          rm -f nginx/.htpasswd
